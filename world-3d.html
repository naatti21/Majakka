<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07141f">
<title>Majakka — Perspective Trial</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.css">
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;color:#d9efed}
*{box-sizing:border-box}
html,body,#scene{width:100%;height:100%;margin:0;overflow:hidden;background:#06121d}
#scene{position:absolute;inset:0}
#scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(2,10,23,.30) 100%)}
.maplibregl-control-container .maplibregl-ctrl-attrib{background:#081927d9;color:#abc8c5;font-size:9px}
.maplibregl-control-container .maplibregl-ctrl-attrib a{color:#c6e3dc}
#message{position:absolute;z-index:15;top:45%;left:50%;width:min(290px,80%);transform:translate(-50%,-50%);padding:15px;border:1px solid #71c8c35a;border-radius:13px;background:#071c2df2;font-size:12px;text-align:center;line-height:1.5}
#message[hidden]{display:none}
#pitch{position:absolute;z-index:12;right:9px;bottom:calc(156px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:7px}
#pitch button{border:1px solid #92d9cf66;background:#0b2737e8;color:#ebf4ef;width:40px;height:40px;border-radius:50%;font-size:18px;box-shadow:0 5px 14px #0007}
#tilt-slide{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;width:40px;height:108px;touch-action:none;user-select:none;border:1px solid #7dbfbb78;border-radius:23px;color:#d6f3ed;font-size:23px;background:linear-gradient(#123a46df,#0a2334ee);box-shadow:0 8px 22px #0008;cursor:ns-resize}
#tilt-slide small{font-size:8px;letter-spacing:.08em;font-weight:750;color:#98cac4}
#tilt-slide:focus-visible{outline:2px solid #f0ca87;outline-offset:3px}#pitch[hidden]{display:none!important}
#hint{position:absolute;z-index:10;left:12px;top:calc(275px + env(safe-area-inset-top,0px));background:#081b29c9;color:#b9dbd8;padding:6px 9px;border-radius:9px;font-size:10px;pointer-events:none}
#hint[hidden]{display:none}
.beacon{position:relative;width:78px;height:92px;cursor:pointer;transform:translate(-50%,-10%);pointer-events:auto}
.beacon .ground{position:absolute;bottom:3px;left:4px;width:70px;height:25px;border-radius:50%;border:1px solid #78dacf88;background:radial-gradient(ellipse,#57c8bd66,transparent 70%);box-shadow:0 0 28px #69dccc64;transform:rotateX(58deg)}
.beacon .beam{position:absolute;bottom:15px;left:26px;width:26px;height:55px;background:linear-gradient(to top,#6cddd47a,#6cddd426 60%,transparent);filter:blur(5px);clip-path:polygon(34% 0,66% 0,100% 100%,0 100%)}
.beacon .orb{position:absolute;bottom:48px;left:31px;width:16px;height:16px;border-radius:50%;background:#9cf7df;border:2px solid #f0fff8;box-shadow:0 0 10px 4px #60f7dc,0 0 25px 8px #49c9c775;animation:float 4s ease-in-out infinite}
.beacon .tag{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:#e0f2ea;text-shadow:0 2px 6px #000,0 0 10px #000}
.beacon.awake .ground{background:radial-gradient(ellipse,#f9c17a66,transparent 70%);border-color:#f4c783}
.beacon.awake .beam{background:linear-gradient(to top,#f4c47b8c,#ebbf7630 60%,transparent)}
.beacon.awake .orb{background:#fbdca2;box-shadow:0 0 10px 4px #f4cb8a,0 0 27px 10px #e6b36b77}
.beacon.temporary .tag{color:#afdfd8;font-size:9px}
.beacon.rift .ground{border-color:#b478d8;background:radial-gradient(ellipse,#9a4dc166,transparent)}
.beacon.rift .beam{background:linear-gradient(to top,#8339af8c,#813ab326,transparent)}
.beacon.rift .orb{background:#1e0c36;border-color:#b18adc;box-shadow:0 0 0 7px #64259542,0 0 21px #b67ee7}
.beacon.player{width:48px;height:56px;transform:translate(-50%,-6%)}
.beacon.player .orb{left:16px;bottom:20px;background:#35bfc4}
.beacon.player .ground{left:-5px;bottom:5px;width:55px}
.beacon.player .beam{bottom:13px;left:14px;height:29px;width:20px}
.beacon.player .tag{display:none}
 .lumen-speck{width:7px;height:7px;border-radius:50%;background:#f4dfac;box-shadow:0 0 7px 2px #ecc88e,0 0 20px 4px #e1a55a77;cursor:pointer;animation:glow 3s ease-in-out infinite}
.lumen-speck:after{content:"";position:absolute;inset:-10px;border:1px solid #e4bc7a38;border-radius:50%}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes glow{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.beacon .orb,.lumen-speck{animation:none}}
</style>
</head>
<body>
<div id="scene"></div>
<div id="message">Preparing the 3D world…</div>
<div id="hint">Use two fingers to rotate and tilt · Experimental 3D</div>
<div id="pitch"><div id="tilt-slide" role="slider" tabindex="0" aria-label="Tilt map with one finger" aria-orientation="vertical" aria-valuemin="18" aria-valuemax="80" aria-valuenow="66">↕<small>TILT</small></div><button id="steeper" type="button" title="Look toward horizon" aria-label="Tilt towards horizon">⇧</button><button id="flatter" type="button" title="Look from above" aria-label="Tilt towards overhead">⇩</button><button id="north" type="button" title="Face north" aria-label="Rotate north">N</button></div>
<script src="./scene-geometry.js?v=041"></script><script src="./aerial-links.js?v=060"></script>
<script type="module">
const reply=(type,payload={})=>parent.postMessage({source:'majakka-3d',type,...payload},location.origin);
const box=document.getElementById('message'),shown=(text)=>{box.textContent=text;box.hidden=false;};
const hide=()=>{box.hidden=true;};
const nodes=[
 {id:'koski',name:'River Current',lat:61.50010,lng:23.76470},
 {id:'square',name:'Quiet Square',lat:61.49772,lng:23.76018},
 {id:'harbor',name:'Southern Lantern',lat:61.49422,lng:23.76218}
];
let map=null,lib=null,world=null,living=null,ready=false,mode='demo',lastFix=null,firstLiveCenter=false,markers=[],selectedId=null,terrainReady=false,userMoved=false,personal=null;
const makeMarker=(point,{kind='node',awake=false,temporary=false,callback=()=>{}}={})=>{
 const el=document.createElement('div');
 el.className='beacon'+(awake?' awake':'')+(temporary?' temporary':'')+(kind==='rift'?' rift':'')+(kind==='player'?' player':'');
 el.innerHTML='<span class="ground"></span><span class="beam"></span><span class="orb"></span><span class="tag"></span>';
 el.querySelector('.tag').textContent=point.name||'';
 el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label',point.name||kind);
 el.addEventListener('click',callback);
 el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();callback();}});
 const marker=new lib.Marker({element:el,anchor:'bottom',pitchAlignment:'viewport',rotationAlignment:'viewport'})
    .setLngLat([point.lng,point.lat]).addTo(map);
 markers.push(marker);return marker;
};
function clearMarkers(){for(const m of markers)m.remove();markers=[];}
function updateGeoJSON(id,features,type){
 const source=map.getSource(id);
 if(source)source.setData({type:'FeatureCollection',features});
 else{
  map.addSource(id,{type:'geojson',data:{type:'FeatureCollection',features}});
  if(type==='field'){
   map.addLayer({id:id+'-fill',type:'fill',source:id,paint:{'fill-color':'#bb9559','fill-opacity':.19}});
   map.addLayer({id:id+'-outline',type:'line',source:id,paint:{'line-color':'#dfbd7c','line-width':2.5,'line-opacity':.78}});
  }else if(type==='haze')map.addLayer({id:id+'-fill',type:'fill',source:id,paint:{'fill-color':'#392447','fill-opacity':.36}});
  else map.addLayer({id:id+'-line',type:'line',source:id,paint:{'line-color':'#c4a670','line-width':2.5,'line-opacity':.8,'line-blur':1}});
 }
}
function addPhysicsSource(name,features){
 const data={type:'FeatureCollection',features};
 const src=map.getSource(name);
 if(src)src.setData(data);
 else map.addSource(name,{type:'geojson',data});
}
let physicsLayersReady=false;
function drawPhysicalWorld(points){
 const G=globalThis.MajakkaSceneGeometry;
 if(!G)throw new Error('Missing first-party 3D light geometry');
 const geo=G.build(points);
 for(const [name,features] of Object.entries(geo))addPhysicsSource('majakka-physical-'+name,features);
 if(physicsLayersReady)return;
 const getColor=['get','color'];
 map.addLayer({id:'majakka-ground',type:'fill',source:'majakka-physical-ground',
  paint:{'fill-color':getColor,'fill-opacity':['match',['get','part'],'aura',.10,'footprint',.29,.1]}});
 map.addLayer({id:'majakka-ground-rim',type:'line',source:'majakka-physical-ground',
  filter:['==',['get','part'],'footprint'],
  paint:{'line-color':getColor,'line-width':1.5,'line-opacity':.55}});
 map.addLayer({id:'majakka-light-shell',type:'fill-extrusion',source:'majakka-physical-shafts',
  filter:['==',['get','part'],'light-shell'],
  paint:{'fill-extrusion-color':getColor,'fill-extrusion-height':['get','height'],
         'fill-extrusion-base':0,'fill-extrusion-opacity':.27}});
 map.addLayer({id:'majakka-light-core',type:'fill-extrusion',source:'majakka-physical-shafts',
  filter:['==',['get','part'],'light-core'],
  paint:{'fill-extrusion-color':getColor,'fill-extrusion-height':['get','height'],
         'fill-extrusion-base':0,'fill-extrusion-opacity':.78}});
 map.addLayer({id:'majakka-core-glow',type:'circle',source:'majakka-physical-cores',
  paint:{'circle-color':getColor,'circle-radius':['interpolate',['linear'],['zoom'],12,3,15,13,18,25],
         'circle-opacity':.42,'circle-blur':.9,'circle-pitch-alignment':'map','circle-pitch-scale':'map'}});
 map.addLayer({id:'majakka-core-spark',type:'circle',source:'majakka-physical-cores',
  paint:{'circle-color':getColor,'circle-radius':['interpolate',['linear'],['zoom'],12,1,15,3,18,6],
         'circle-opacity':.95,'circle-blur':.1,'circle-pitch-alignment':'map','circle-pitch-scale':'map'}});
 map.addLayer({id:'majakka-lumen-glow',type:'circle',source:'majakka-physical-lumens',
  paint:{'circle-color':'#f4d994','circle-radius':['interpolate',['linear'],['zoom'],12,3,15,9,18,14],
         'circle-opacity':.7,'circle-blur':.72,'circle-pitch-alignment':'map','circle-pitch-scale':'map'}});
 map.addLayer({id:'majakka-lumen-spark',type:'circle',source:'majakka-physical-lumens',
  paint:{'circle-color':'#ffe9b6','circle-radius':2.5,'circle-opacity':.9}});
 // Transparent targets have stable 44px taps even though the physical beacons shrink toward the horizon.
 map.addLayer({id:'majakka-physical-hit',type:'circle',source:'majakka-physical-targets',
  paint:{'circle-radius':22,'circle-color':'#ffffff','circle-opacity':.01,
         'circle-pitch-alignment':'viewport','circle-pitch-scale':'viewport'}});
 map.on('click','majakka-physical-hit',e=>{
  const id=e.features?.[0]?.properties?.id;
  if(!id||id==='player'||id.startsWith('ambient-'))return;
  if(mode==='live'){
   if(id==='veil')reply('live-rift-select');
   else if(id.startsWith('echo-'))reply('live-node-select',{id});
   return;
  }
  if(id==='rift')reply('rift-select');
  else if(nodes.some(n=>n.id===id))reply('node-select',{id});
 });
 // Ambient glimmers cannot be collected by tapping.
 physicsLayersReady=true;
}
let aerialLayersReady=false;
function drawAerialLinks(pairs){
 const A=globalThis.MajakkaAerialLinks;if(!A)return;
 const geo=A.build(pairs);
 for(const name of ['halo','core'])addPhysicsSource('majakka-aerial-'+name,geo[name]);
 if(aerialLayersReady)return;
 map.addLayer({id:'majakka-aerial-glow',type:'fill-extrusion',source:'majakka-aerial-halo',
  paint:{'fill-extrusion-color':['get','color'],'fill-extrusion-base':['get','base'],
    'fill-extrusion-height':['get','height'],'fill-extrusion-opacity':.26,
    'fill-extrusion-vertical-gradient':true}});
 map.addLayer({id:'majakka-aerial-core',type:'fill-extrusion',source:'majakka-aerial-core',
  paint:{'fill-extrusion-color':['get','color'],'fill-extrusion-base':['get','base'],
    'fill-extrusion-height':['get','height'],'fill-extrusion-opacity':.70}});
 aerialLayersReady=true;
}

/* v0.8 personal field: GPU sparks and meter-scaled collection/arrow. */
function renderPersonal(){
 if(!map||!ready)return;
 const fc=features=>({type:'FeatureCollection',features});
 const update=(id,features)=>{const src=map.getSource(id),data=fc(features);if(src)src.setData(data);else map.addSource(id,{type:'geojson',data});};
 const features=(personal?.points||[]).map(p=>({type:'Feature',properties:{size:p.size||'dust'},geometry:{type:'Point',coordinates:[p.lng,p.lat]}}));
 update('personal-sparks',features);
 if(!map.getLayer('personal-sparks-glow')){
  map.addLayer({id:'personal-sparks-glow',type:'circle',source:'personal-sparks',paint:{'circle-color':'#ebc588','circle-radius':['match',['get','size'],'heart',16,'glow',9,5],'circle-opacity':.17,'circle-blur':.85}});
  map.addLayer({id:'personal-sparks-points',type:'circle',source:'personal-sparks',paint:{'circle-color':'#f9dfaa','circle-radius':['match',['get','size'],'heart',6,'glow',3,1.5],'circle-opacity':['match',['get','size'],'heart',.94,'glow',.65,.30],'circle-pitch-alignment':'map','circle-pitch-scale':'map'}});
 }
 const fix=personal?.fix,geom=globalThis.MajakkaSceneGeometry;
 update('personal-radius',fix&&geom?[{type:'Feature',properties:{},geometry:geom.circle(fix,personal.range||30)}]:[]);
 if(!map.getLayer('personal-radius-fill')){
  map.addLayer({id:'personal-radius-fill',type:'fill',source:'personal-radius',paint:{'fill-color':'#67e2ce','fill-opacity':.06}});
  map.addLayer({id:'personal-radius-edge',type:'line',source:'personal-radius',paint:{'line-color':'#a4f6e1','line-width':1.3,'line-opacity':.7}});
 }
 const arrow=[];
 if(fix){
  const a=map.getBearing()*Math.PI/180; // The arrow shows the 3D camera view direction.
  const dx=Math.sin(a),dy=Math.cos(a),scale=111320*Math.max(.15,Math.cos(fix.lat*Math.PI/180));
  const vertex=(f,s)=>[fix.lng+(f*dx+s*dy)/scale,fix.lat+(f*dy-s*dx)/111320];
  arrow.push({type:'Feature',properties:{},geometry:{type:'Polygon',coordinates:[[vertex(18,0),vertex(-2,9),vertex(-2,4),vertex(-12,4),vertex(-12,-4),vertex(-2,-4),vertex(-2,-9),vertex(18,0)]]}});
 }
 update('personal-arrow',arrow);
 if(!map.getLayer('personal-arrow-solid'))map.addLayer({id:'personal-arrow-solid',type:'fill-extrusion',source:'personal-arrow',paint:{'fill-extrusion-color':'#83f0d9','fill-extrusion-height':5,'fill-extrusion-base':0,'fill-extrusion-opacity':.97}});
}

function showWorld(){
 if(!map||!ready)return;
 document.getElementById('hint').textContent=mode==='live'?'VIRTUAL NODES · personal preview only':'Drag ↕ to tilt · two fingers to rotate';
 clearMarkers();
 const fieldFeatures=[],lines=[],points=[],haze=[],arcPairs=[];
 if(mode==='demo'){
  for(const n of nodes)points.push({...n,kind:(world?.awake||[]).includes(n.id)?'awake':'quiet'});
  points.push({id:'rift',name:'Interference',lat:61.4966,lng:23.7646,kind:world?.riftClear?'restored':'rift'});
  if(world?.field)fieldFeatures.push({type:'Feature',
    geometry:{type:'Polygon',coordinates:[[...nodes.map(n=>[n.lng,n.lat]),[nodes[0].lng,nodes[0].lat]]]},properties:{}});
  for(const [a,b] of (world?.edges||[])){
   const x=nodes.find(n=>n.id===a),y=nodes.find(n=>n.id===b);
   if(x&&y)arcPairs.push([x,y]);
  }
 }else if(living?.projection){
  const live=living.projection;
  points.push(...live.nodes);
  points.push(live.rift);
  // v0.8: use personal field only; old position-following glimmers are retired.
  points.push(...(live.outer||[]));
  if(live.interference>0&&live.rift.kind!=='restored'){
   const G=globalThis.MajakkaSceneGeometry;
   haze.push({type:'Feature',properties:{},geometry:G.circle(live.rift,80+live.interference*34)});
  }
  if(lastFix&&!personal)points.push({id:'player',name:'You',...lastFix,kind:'player'});
  for(const ids of (live.fields||[]).slice(0,18)){
   const vertices=ids.map(id=>live.nodes.find(n=>n.id===id)).filter(Boolean);
   if(vertices.length!==3)continue;
   fieldFeatures.push({type:'Feature',geometry:{type:'Polygon',coordinates:[[...vertices.map(n=>[n.lng,n.lat]),[vertices[0].lng,vertices[0].lat]]]},properties:{}});
  }
  for(const [a,b] of live.edges.slice(0,24)){
    const x=live.nodes.find(n=>n.id===a),y=live.nodes.find(n=>n.id===b);
    if(x&&y)arcPairs.push([x,y]);
  }
 }else if(lastFix){
  points.push({id:'player',name:'You',...lastFix,kind:'player'});
 }
 drawPhysicalWorld(points);
 drawAerialLinks(arcPairs);
 updateGeoJSON('majakka-haze',haze,'haze');
 updateGeoJSON('majakka-field',fieldFeatures,'field');
 updateGeoJSON('majakka-threads',lines,'line');
 renderPersonal();
}
function receive(data){
 if(data.type==='init'){
  world=data.world||null;living=world?.live||null;mode=data.mode==='live'?'live':'demo';document.getElementById('pitch').hidden=false;
  if(data.fix)lastFix=data.fix;
  if(map&&ready){
   if(data.center&&Array.isArray(data.center))map.jumpTo({center:data.center,zoom:Math.max(13,data.zoom||15)});
   showWorld();if(mode==='live'&&lastFix&&!userMoved&&!firstLiveCenter)centerLive();
  }
 }else if(data.type==='mode'){
  const previous=mode;mode=data.mode==='live'?'live':'demo';
  if(mode==='live'&&previous!=='live')firstLiveCenter=false;
  if(mode==='live'&&lastFix&&!userMoved&&!firstLiveCenter)centerLive();
  if(map&&ready)showWorld();
 }else if(data.type==='gps'){
  if(!data.fix)return;
  lastFix=data.fix;
  if(mode==='live'&&map&&ready){
   if(!firstLiveCenter&&!userMoved)centerLive();
   showWorld();
  }
 }else if(data.type==='world'){world=data.world||{};living=world.live||living;if(ready)showWorld();}
 else if(data.type==='living'){living=data.live||null;document.getElementById('pitch').hidden=Boolean(data.selected);if(ready&&mode==='live')showWorld();}
 else if(data.type==='lumen'){personal=data.personal||null;if(ready&&mode==='live')renderPersonal();}
 else if(data.type==='recenter'){
  if(!map||!ready)return;
  if(mode==='live'&&lastFix)centerLive();
  else map.flyTo({center:[23.7623,61.4984],zoom:15,pitch:66,duration:700,essential:true});
 }
}
function centerLive(){
 if(!map||!ready||!lastFix)return;
 firstLiveCenter=true;
 map.easeTo({center:[lastFix.lng,lastFix.lat],zoom:14.2,duration:700});
}
addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==parent||e.data?.source!=='majakka-parent')return;
 receive(e.data);
});
document.getElementById('steeper').addEventListener('click',()=>{if(map)map.easeTo({pitch:Math.min(80,map.getPitch()+12),duration:300});});
document.getElementById('flatter').addEventListener('click',()=>{if(map)map.easeTo({pitch:Math.max(18,map.getPitch()-12),duration:300});});
document.getElementById('north').addEventListener('click',()=>{if(map)map.easeTo({bearing:0,duration:500});});
const tiltSlide=document.getElementById('tilt-slide');
let tiltPointer=null,tiltLastY=0;
const setPitch=(next)=>{
 if(!map)return;
 const value=Math.max(18,Math.min(80,next));
 map.setPitch(value);
 tiltSlide.setAttribute('aria-valuenow',String(Math.round(value)));
};
tiltSlide.addEventListener('pointerdown',e=>{
 if(!map)return;
 e.stopPropagation();e.preventDefault();
 tiltPointer=e.pointerId;tiltLastY=e.clientY;
 tiltSlide.setPointerCapture(e.pointerId);
});
tiltSlide.addEventListener('pointermove',e=>{
 if(tiltPointer!==e.pointerId||!map)return;
 e.preventDefault();e.stopPropagation();
 setPitch(map.getPitch()+(tiltLastY-e.clientY)*.36);
 tiltLastY=e.clientY;
});
const endTilt=e=>{if(tiltPointer===e.pointerId)tiltPointer=null;};
tiltSlide.addEventListener('pointerup',endTilt);
tiltSlide.addEventListener('pointercancel',endTilt);
tiltSlide.addEventListener('keydown',e=>{
 if(!map)return;
 if(e.key==='ArrowUp'||e.key==='ArrowDown'){
  e.preventDefault();setPitch(map.getPitch()+(e.key==='ArrowUp'?6:-6));
 }
});

try {
 shown('Loading 3D engine…');
 try{lib=await import('https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.mjs');}
 catch{lib=await import('https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs');}
 if(typeof lib.supported==='function'&&!lib.supported())throw new Error('3D needs WebGL on this device');
 shown('Loading 3D map and terrain…');
 map=new lib.Map({
  container:'scene',
  style:'https://tiles.openfreemap.org/styles/fiord',
  center:[23.7623,61.4984],zoom:15,pitch:66,bearing:-12,maxPitch:85,
  dragRotate:true,attributionControl:{compact:true},renderWorldCopies:false,antialias:false,
  maxZoom:18,minZoom:3
 });
 map.touchZoomRotate.enableRotation();
 map.on('dragstart',()=>{userMoved=true;});
 map.on('rotate',()=>{if(ready&&mode==='live')renderPersonal();});
 map.on('load',()=>{
  ready=true;try{showWorld();hide();reply('ready');}catch(error){console.warn('3D geometry unavailable',error);reply('error',{message:String(error?.message||error)});return;}
  // Enhancement only: loss of a terrain service must not blank the base map.
  try{
   if(typeof map.setSky==='function')map.setSky({'sky-color':'#07121d','horizon-color':'#203841','fog-color':'#12242e','sky-horizon-blend':.52,'horizon-fog-blend':.65});
  }catch(e){console.warn('Sky unavailable',e);}
  try{
   map.addSource('majakka-dem',{type:'raster-dem',url:'https://tiles.mapterhorn.com/tilejson.json',encoding:'terrarium',tileSize:512});
   map.setTerrain({source:'majakka-dem',exaggeration:1});
   terrainReady=true;
  }catch(e){console.warn('Terrain unavailable, pitched map stays active',e);}
  // Optional 3D building extrusions on OpenMapTiles vector data, if present.
  try{
   const style=map.getStyle(),sourceId=Object.keys(style.sources).find(k=>style.sources[k].type==='vector');
   if(sourceId)map.addLayer({id:'majakka-buildings',type:'fill-extrusion',source:sourceId,'source-layer':'building',minzoom:14,
    paint:{'fill-extrusion-color':'#1a3941','fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],8],'fill-extrusion-opacity':.38}});
  }catch(e){console.warn('Building extrusion unavailable',e);}
 });
 map.on('error',e=>{console.warn('MapLibre 3D:',e?.error||e);});
 map.on('remove',()=>{ready=false;});
}catch(error){
 shown('3D is unavailable on this connection or device. Returning to 2D.');
 reply('error',{message:String(error?.message||error).slice(0,160)});
}
</script>
</body>
</html>
