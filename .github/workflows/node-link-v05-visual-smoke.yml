name: Majakka v0.5 - two Node 3D link visual smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/node-link-v05/**"
      - "tests/node-link-v05.test.mjs"
      - ".github/workflows/node-link-v05-visual-smoke.yml"
permissions:
  contents: read
jobs:
  link-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Take real WebGL screenshots with link on/off and camera changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p node-link-qa
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          URL="https://naatti21.github.io/Majakka/experiments/node-link-v05/"
          for retry in $(seq 1 36); do
            if curl -fsSL -o /tmp/link-v05.html "$URL?deploy=$retry"                && grep -q "link-world.js?v=050" /tmp/link-v05.html                && grep -q 'KATKAISE YHTEYS' /tmp/link-v05.html; then break; fi
            sleep 5
          done
          grep -q "link-world.js?v=050" /tmp/link-v05.html
          capture() {
            local name="$1" params="$2"
            timeout 100s "$CHROME" --headless=new --no-sandbox               --disable-dev-shm-usage --enable-webgl               --enable-unsafe-swiftshader --use-gl=angle               --use-angle=swiftshader --hide-scrollbars               --window-size=720,1500 --virtual-time-budget=24000               --screenshot="node-link-qa/$name.png"               "$URL?$params&qa=050"               >"node-link-qa/$name.log" 2>&1 || true
            test -s "node-link-qa/$name.png"
          }
          capture connected-main "linked=1&zoom=16.5&pitch=55&bearing=-15"
          capture disconnected-main "linked=0&zoom=16.5&pitch=55&bearing=-15"
          capture connected-side "linked=1&zoom=16.7&pitch=65&bearing=80"
          capture connected-top "linked=1&zoom=16.0&pitch=0&bearing=0"
          capture connected-detail "linked=1&zoom=17.2&pitch=50&bearing=-25"
          ls -lh node-link-qa/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: majakka-v05-link-webgl-images
          path: node-link-qa/
          retention-days: 5
