name: Native Kaiku Lab - Android debug APK

# Build once for a new native proof-of-concept PR; afterwards only on changes.
# Official export templates are ~1.3 GB. Public repo GitHub Actions capacity applies.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "native-client/**"
      - ".github/workflows/native-kaiku-android.yml"

permissions:
  contents: write # bounded snapshot commit to this development branch only

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.7.2 editor and Android debug template
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.7.2
          URL="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          curl -fL --retry 3 "${URL}/Godot_v${VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${VERSION}-stable_linux.x86_64"
          ln -s "$RUNNER_TEMP/godot/Godot_v${VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 "${URL}/Godot_v${VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -p "$RUNNER_TEMP/templates.tpz" templates/android_debug.apk > "$HOME/.local/share/godot/export_templates/${VERSION}.stable/android_debug.apk"
          echo "${VERSION}.stable" > "$HOME/.local/share/godot/export_templates/${VERSION}.stable/version.txt"
          test -s "$HOME/.local/share/godot/export_templates/${VERSION}.stable/android_debug.apk"

      - name: Configure Android tooling and temporary debug signing
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/platform-tools/adb"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/majakka-debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 1000 \
            -dname "CN=Majakka Debug,O=Kaiku Lab,C=FI"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/majakka-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Acquire and commit bounded OSM Tampere vector snapshot
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s native-client/assets/maps/tampere-vector-pilot.json ]; then
            python3 native-client/tools/build_tampere_osm_snapshot.py
            # Persist the actual OSM snapshot as a reviewed file in the branch,
            # not only in a transient APK / job environment.
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add native-client/assets/maps/tampere-vector-pilot.json
              git commit -m "data(native): pin verified Tampere OSM vector pilot snapshot"
              git push origin "HEAD:${{ github.head_ref }}"
            fi
          fi
          test -s native-client/assets/maps/tampere-vector-pilot.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("native-client/assets/maps/tampere-vector-pilot.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          assert len(data["elements"]) >= 65
          assert data["metadata"]["license"] == "ODbL-1.0"
          print("BUNDLED_OSM_DATA_OK", len(data["elements"]), "ways", p.stat().st_size, "bytes")
          PY

      - name: Import project and test logic
        shell: bash
        run: |
          set -euo pipefail
          # A failed GDScript assert can leave a SceneTree test running forever.
          # Keep CI bounded so the failing test can be identified from logs.
          timeout 90s godot --headless --path native-client --editor --import --quit
          for test in smoke flintail_smoke world_map_smoke perspective_map_smoke map_style_smoke vector_map_smoke; do
            echo "::group::Godot smoke: ${test}"
            timeout 45s godot --headless --path native-client --script "res://tests/${test}.gd"
            echo "::endgroup::"
          done

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-client/build
          godot --headless --path native-client --export-debug "Android" build/majakka-kaiku-lab-debug.apk
          test -s native-client/build/majakka-kaiku-lab-debug.apk
          ls -lh native-client/build/*.apk

      - name: Upload APK test artifact
        uses: actions/upload-artifact@v4
        with:
          name: majakka-vector-world-v0.6-android-debug
          path: native-client/build/majakka-kaiku-lab-debug.apk
          if-no-files-found: error
          retention-days: 7
