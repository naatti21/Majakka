name: Majakka v0.6 - 3 lighthouse network visual smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/node-network-v06/**"
      - "tests/node-network-v06.test.mjs"
      - ".github/workflows/node-network-v06-visual-smoke.yml"
permissions:
  contents: read
jobs:
  network-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Render all three PBR nodes and 0-3 staged connection states in Chrome WebGL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p network-qa
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          URL="https://naatti21.github.io/Majakka/experiments/node-network-v06/"
          for trial in $(seq 1 36); do
            if curl -fsSL -o /tmp/majakka-v06.html "$URL?published=$trial"               && grep -q "network-world.js?v=060" /tmp/majakka-v06.html               && grep -q 'HERÄTÄ VERKOSTO' /tmp/majakka-v06.html; then break; fi
            sleep 5
          done
          grep -q "network-world.js?v=060" /tmp/majakka-v06.html
          capture() {
            local title="$1" params="$2"
            timeout 100s "$CHROME" --headless=new --no-sandbox               --disable-dev-shm-usage --enable-webgl               --enable-unsafe-swiftshader --use-gl=angle               --use-angle=swiftshader --hide-scrollbars               --window-size=720,1500 --virtual-time-budget=25000               --screenshot="network-qa/$title.png"               "$URL?$params&qa=060" >"network-qa/$title.log" 2>&1 || true
            test -s "network-qa/$title.png"
          }
          for stage in 0 1 2 3; do
            capture "stage-$stage-main" "stage=$stage&quality=medium&zoom=17&pitch=55&bearing=-15"
          done
          capture stage-3-tilt "stage=3&zoom=17.2&pitch=70&bearing=80"
          capture stage-3-top "stage=3&zoom=16.6&pitch=0&bearing=0"
          capture stage-3-far "stage=3&zoom=15.6&pitch=55&bearing=-15"
          ls -lh network-qa/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: majakka-three-beacon-network-v06
          path: network-qa/
          retention-days: 5
