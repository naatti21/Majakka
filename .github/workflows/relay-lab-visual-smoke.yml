name: Relay 3D designs - visual smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "experiments/relay-concept-lab/**"
      - "tests/relay-concept-lab.test.mjs"
      - ".github/workflows/relay-lab-visual-smoke.yml"
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Capture lighthouse v0.3 plus comparator and deterministic views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-relay
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          URL="https://naatti21.github.io/Majakka/experiments/relay-concept-lab/"
          # Wait until latest commit is published, not merely any HTML page.
          for retry in $(seq 1 30); do
            if curl -fsSL -o /tmp/relay-page.html "$URL?ready=$retry" && grep -q "relay-3d.js?v=004" /tmp/relay-page.html && grep -q "START_CAMERA" /tmp/relay-page.html; then break; fi
            sleep 5
          done
          grep -q "relay-3d.js?v=004" /tmp/relay-page.html
          grep -q "START_CAMERA" /tmp/relay-page.html
          capture() {
            local name="$1" args="$2"
            timeout 95s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage               --enable-webgl --enable-unsafe-swiftshader               --use-gl=angle --use-angle=swiftshader               --hide-scrollbars --window-size=720,1500               --virtual-time-budget=28000               --screenshot="visual-relay/$name.png"               "$URL?$args&qa=visual-v03" > "visual-relay/$name.log" 2>&1 || true
            test -s "visual-relay/$name.png"
          }
          capture chromatic-comparator "concept=chromatic&pitch=55&bearing=-15&zoom=17.1"
          capture lighthouse-01-main "concept=lighthouse&grade=3&pitch=55&bearing=-15&zoom=17.1"
          capture lighthouse-02-tilt "concept=lighthouse&grade=3&pitch=70&bearing=65&zoom=17"
          capture lighthouse-03-low "concept=lighthouse&grade=3&pitch=25&bearing=155&zoom=17.5"
          capture lighthouse-04-top "concept=lighthouse&grade=3&pitch=0&bearing=0&zoom=16.5"
          capture lighthouse-05-far "concept=lighthouse&grade=3&pitch=55&bearing=0&zoom=15.5"
          capture lighthouse-06-detail "concept=lighthouse&grade=3&pitch=55&bearing=225&zoom=18"
          capture lighthouse-grade-1 "concept=lighthouse&grade=1&pitch=55&bearing=-15&zoom=17.1"
          capture lighthouse-grade-2 "concept=lighthouse&grade=2&pitch=55&bearing=-15&zoom=17.1"
          ls -lh visual-relay/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: majakka-relay-3d-concept-qa
          path: visual-relay/
          retention-days: 5
