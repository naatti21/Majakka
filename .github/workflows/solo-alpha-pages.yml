name: Majakka Solo Alpha Pages
on:
  push:
    branches:
      - feature/personal-lumen-v0.8
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-solo-alpha
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout unchanged published root
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          persist-credentials: false
      - name: Checkout Solo Alpha from feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/personal-lumen-v0.8
          path: alpha-source
          persist-credentials: false
      - name: Build isolated /solo/ with original root intact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/solo
          rsync -a --delete \
            --exclude='.git/' --exclude='.github/' --exclude='tests/' \
            --exclude='backend/' --exclude='docs/' \
            --exclude='*.md' --exclude='package*.json' \
            alpha-source/ site/solo/
          touch site/.nojekyll
          test -s site/index.html
          test -s site/solo/index.html
          test -s site/solo/solo-echo.js
          test -s site/solo/atlas-world.js
          test -s site/solo/living-world.js
          test -s site/solo/scene-geometry.js
          test -s site/solo/sw.js
          printf 'Alpha files: '
          find site/solo -type f | wc -l
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}solo/
    steps:
      - name: Deploy original root plus /solo/ Alpha
        id: deployment
        uses: actions/deploy-pages@v4
